name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    timeout-minutes: 20
    # Python 3.8 is unavailable on newer Ubuntu runner images.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.11']
        parsimonious-version: ['0.10.0', '0.11.0']
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c ci-constraints.txt -r test-requirements.txt . "parsimonious==${{ matrix.parsimonious-version }}"
      - name: Test
        run: |
          python -m unittest
